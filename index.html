<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site NSI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        #surpriseButton {
            background-color: #007BFF;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        #surpriseButton:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bienvenue!</h1>
        <p>Cliquez sur le bouton pour voir le site.</p>
        <button id="surpriseButton">Allez sur le site!</button>
    </div>

    <script>
    document.getElementById('surpriseButton').addEventListener('click', function() {
        // --- 1. LE SON (Priorité n°1) ---
        // Remplace l'URL ci-dessous par le lien de ton fichier MP3
        const audio = new Audio('https://www.myinstants.com/media/sounds/rick-roll.mp3'); 
        audio.volume = 1.0; // Volume du lecteur au maximum
        audio.play().catch(e => console.log("L'audio n'a pas pu démarrer :", e));

        // --- 2. LES NOTIFICATIONS ---
        if ('Notification' in window) {
            Notification.requestPermission().then(function(result) {
                if (result === 'granted') {
                    showNotifications();
                }
            });
        }

        // --- 3. LES ALERTES ---
        showAlerts();
    });

function showNotifications() {
    const messages = ['Va te faire enculer 1!', 'Nik ta race 2!', 'va te faire foutre 3!'];
    
    messages.forEach((message, index) => {
        setTimeout(() => {
            new Notification('Salope !', {
                body: message,
                // L'icône (petite image carrée)
                icon: 'https://cdn-icons-png.flaticon.com/512/179/179386.png', 
                // La grande image (certains navigateurs PC l'affichent)
                image: 'https://media.istockphoto.com/id/1459210805/fr/photo/homme-riant-aux-%C3%A9clats-en-tenant-le-ventre-et-en-vous-pointant-du-doigt-moquerie.jpg?s=612x612&w=0&k=20&c=Vk9Shiq7AhFhcG38M05iFwOX5qo8T9Ri7qWawTKUhU0=',
                vibrate: [200, 100, 200] // Fait vibrer le téléphone si autorisé
            });
        }, index * 1000);
    });
}

    function showAlerts() {
        const messages = [
            'Tu es vraiment une dinde',
            'Gros vié tu fais le mec',
            'Tu te la sens plus',
            'Grosse Salope !'
        ];
        messages.forEach((message, index) => {
            setTimeout(() => {
                alert(message);
            }, index * 1500);
        });
    }
</script>
</body>
</html>
