<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Authentication Service</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --error: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .auth-container {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid var(--accent);
            padding: 40px;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header svg { width: 50px; fill: var(--primary); }
        .header h1 { font-size: 1.2rem; color: var(--primary); margin: 10px 0 5px; text-transform: uppercase; letter-spacing: 1px; }
        .header p { font-size: 0.85rem; color: #7f8c8d; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; font-weight: bold; color: #34495e; margin-bottom: 8px; }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 3px;
            box-sizing: border-box;
            background: #fafafa;
        }

        .btn-auth {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 3px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-auth:hover { background: #1a252f; }

        /* Section d'analyse (Fausse) */
        #analysis { display: none; text-align: left; }
        .log-terminal {
            background: #1e272e;
            color: #2ecc71;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            border-radius: 3px;
            height: 120px;
            overflow: hidden;
            margin: 20px 0;
        }

        .loader-bar {
            height: 4px;
            background: #eee;
            position: relative;
            margin-bottom: 10px;
        }

        .loader-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }

        .footer-info {
            font-size: 0.7rem;
            color: #bdc3c7;
            text-align: center;
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div id="step-login">
        <div class="header">
            <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            <h1>Accès Sécurisé</h1>
            <p>Protocole IEEE 802.1X Authentification</p>
        </div>

        <div class="form-group">
            <label>IDENTIFIANT RÉSEAU</label>
            <input type="text" id="user" placeholder="ID Utilisateur">
        </div>
        <div class="form-group">
            <label>CLEF DE CHIFFREMENT (WPA3)</label>
            <input type="password" id="pass" placeholder="••••••••">
        </div>

        <button class="btn-auth" onclick="startAnalysis()">AUTHENTIFICATION</button>
    </div>

    <div id="analysis">
        <div class="header">
            <h1 id="status-title">Initialisation SSL...</h1>
        </div>
        <div class="loader-bar"><div class="loader-fill" id="bar"></div></div>
        <div class="log-terminal" id="terminal"></div>
        <p style="font-size: 0.8rem; text-align: center;" id="loading-sub">Échange de certificats en cours...</p>
    </div>

    <div class="footer-info">
        Système de Gestion de Réseau Centralisé &copy; 2026<br>
        ID de session : <span id="session-id"></span>
    </div>
</div>

   <script>
    // Génère un faux ID de session pour le look pro
    document.getElementById('session-id').innerText = Math.random().toString(36).substr(2, 9).toUpperCase();

    const logs = [
        "> Requesting handshake...",
        "> Handshake established (AES-256)",
        "> Checking hardware MAC address...",
        "> Device recognized: Unauthorized",
        "> Attempting bypass protocol...",
        "> WARNING: Security breach detected",
        "> Root access requested...",
        "> Accessing private photos...",
        "> Wifi SSID : Julo",
        "> Password : lojumara"
    ];

    function startAnalysis() {
        document.getElementById('step-login').style.display = 'none';
        document.getElementById('analysis').style.display = 'block';

        let i = 0;
        let progress = 0;
        const terminal = document.getElementById('terminal');
        const bar = document.getElementById('bar');
        const title = document.getElementById('status-title');

        const interval = setInterval(() => {
            if (progress >= 100) {
                clearInterval(interval);
                triggerPopups(); // Lance les pop-ups à la fin
            } else {
                progress += Math.random() * 8;
                if (progress > 100) progress = 100;
                bar.style.width = progress + '%';

                if (i < logs.length && progress > (i * 10)) {
                    const line = document.createElement('div');
                    line.innerText = logs[i];
                    terminal.appendChild(line);
                    terminal.scrollTop = terminal.scrollHeight;
                    i++;
                }
            }
        }, 350);
    }

    function triggerPopups() {
        // Série de pop-ups de panique
        alert("⚠️ ALERTE DE SÉCURITÉ : Activité suspecte détectée sur cet appareil.");
        alert("🔒 Votre système a été verrouillé pour protéger les données du réseau.");
        alert("📁 4 238 fichiers personnels sont en cours de transfert vers nos serveurs...");
        alert("📷 Accès à la caméra frontale activé. Souriez !");

        // Changement final visuel sur la page
        const card = document.querySelector('.auth-container');
        card.style.borderColor = "#e74c3c";
        document.getElementById('status-title').innerText = "T'ES TROP CRÉDULE !";
        document.getElementById('status-title').style.color = "#e74c3c";
        document.getElementById('loading-sub').innerHTML = "<b style='color:red; font-size: 20px;'>Virus installé avec succès</b>";
    }
</script>
</body>
</html>
